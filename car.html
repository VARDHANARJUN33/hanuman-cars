<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="View used car details at Hanuman Cars, Gangur, Vijayawada."
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <title>Car Details | Hanuman Cars</title>


    <!-- ==========================================
         MAIN WEBSITE CSS
         ========================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >


    <!-- ==========================================
         CAR DETAILS CSS
         ========================================== -->

    <link
        rel="stylesheet"
        href="car.css"
    >

</head>


<body>


    <!-- ==========================================
         HEADER
         ========================================== -->

    <header class="site-header">

        <a
            class="brand"
            href="index.html"
            aria-label="Hanuman Cars home"
        >

            <span class="brand-main">
                HANUMAN
            </span>

            <span class="brand-sub">
                CARS
            </span>

        </a>


        <!-- Mobile Menu Button -->

        <button
            class="menu-toggle"
            id="menuToggle"
            aria-label="Open menu"
            aria-expanded="false"
            type="button"
        >
            ☰
        </button>


        <!-- Navigation -->

        <nav
            class="nav"
            id="siteNav"
        >

            <a href="index.html#home">
                Home
            </a>

            <a href="index.html#cars">
                Cars
            </a>

            <a href="index.html#about">
                About
            </a>

            <a href="index.html#contact">
                Contact
            </a>

        </nav>

    </header>



    <!-- ==========================================
         MAIN CAR DETAILS
         ========================================== -->

    <main>

        <section
            class="section container car-details-section"
        >

            <!--
                JavaScript will load the selected
                car from n8n / Google Sheets.

                Example:

                car.html?id=hyundai-creta-sx
            -->

            <div
                id="carDetails"
                aria-live="polite"
            >

                <!-- Loading State -->

                <div class="car-loading">

                    <p>
                        Loading car details...
                    </p>

                </div>

            </div>

        </section>

    </main>



    <!-- ==========================================
         FOOTER
         ========================================== -->

    <footer class="footer">

        <div class="container footer-inner">


            <!-- Business -->

            <div>

                <strong>
                    HANUMAN CARS
                </strong>

                <span>
                    • Gangur, Vijayawada
                </span>

            </div>


            <!-- Copyright -->

            <div>

                ©
                <span id="year"></span>
                Hanuman Cars

            </div>

        </div>

    </footer>



    <!-- ==========================================
         JAVASCRIPT
         ========================================== -->

    <script src="script.js"></script>


</body>

</html>
